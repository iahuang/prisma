[package]
name = "prisma"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mlua = { version = "0.12.2", features = ["luau", "error-send"] }
naga = { version = "30", features = ["wgsl-in"] }
parlance = "0.1.1"
parley = "0.12.0"
png = "0.18.1"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
vello = "0.11"

# vello patched to report GPU buffer overflow instead of rendering a silent
# blank: see vendor/vello/PRISMA.md.
[patch.crates-io]
vello = { path = "vendor/vello" }
